name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require canonical semantic version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Refusing non-canonical release tag: %s\n' "$RELEASE_TAG"
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            executable: kern
            archive: tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            executable: kern
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: amd64
            executable: kern
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            executable: kern
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            executable: kern.exe
            archive: zip
          - os: windows-latest
            goos: windows
            goarch: arm64
            executable: kern.exe
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependency checksums
        run: go mod verify

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p stage dist
          go build -trimpath -ldflags "-buildid= -s -w -X github.com/userInner/kern/internal/transport/cli.Version=$VERSION" -o "stage/${{ matrix.executable }}" ./cmd/kern
          cp README.md stage/
          cp LICENSE THIRD_PARTY_NOTICES.md stage/

      - name: Create tar archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C stage -czf "dist/kern-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" .

      - name: Create zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "stage/*" -DestinationPath "dist/kern-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kern-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish signed release evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kern-*
          path: dist
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          path: .
          format: spdx-json
          output-file: dist/kern-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum kern-* > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Kern $RELEASE_TAG"
          fi
