name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependency checksums
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal sdk/kern sdk/embedded)"
          if [[ -n "$files" ]]; then
            printf 'The following Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run lint checks
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Run tests
        run: go test -coverprofile=coverage.out ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Validate release-quality evaluation assets
        run: go run ./cmd/kern eval validate --output json ./evals/go

      - name: Run Base and Go Expert smoke evaluation
        shell: bash
        run: |
          data_dir="$(mktemp -d)"
          go run ./cmd/kern eval compare --data-dir "$data_dir" --variants general.base,expert.go ./evals/smoke

      - name: Verify reproducible CLI build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b"
          go build -trimpath -ldflags "-buildid= -X github.com/userInner/kern/internal/transport/cli.Version=ci" -o "$RUNNER_TEMP/build-a/kern" ./cmd/kern
          go build -trimpath -ldflags "-buildid= -X github.com/userInner/kern/internal/transport/cli.Version=ci" -o "$RUNNER_TEMP/build-b/kern" ./cmd/kern
          cmp "$RUNNER_TEMP/build-a/kern" "$RUNNER_TEMP/build-b/kern"

  clients:
    name: Web and TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build Web client
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

      - name: Verify committed Web assets
        run: git diff --exit-code -- internal/transport/httpapi/web

      - name: Build and test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

  cross-platform:
    name: ${{ matrix.os }} smoke test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build CLI
        run: go build -trimpath ./cmd/kern
