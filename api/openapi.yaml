        media_type:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif]
        data:
          type: string
          format: byte
          description: Standard base64-encoded file bytes; each decoded image is limited to 8 MiB and all images to 12 MiB.
    ModelProvider:
      type: string
      enum: [openai-compatible, ollama]
    ModelConfig:
      type: object
      required:
        - schema_version
        - id
        - name
        - provider
        - base_url
        - model
        - has_api_key
        - enabled
        - is_default
        - created_at
        - updated_at
      properties:
        schema_version:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ModelProvider"
        base_url:
          type: string
          format: uri
        model:
          type: string
        has_api_key:
          type: boolean
        enabled:
          type: boolean
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelConfigInput:
      type: object
      additionalProperties: false
      required: [name, provider, base_url, model]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          $ref: "#/components/schemas/ModelProvider"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
          maxLength: 256
        api_key_env:
          type: string
          pattern: "^[A-Z_][A-Z0-9_]{0,127}$"
          description: Environment variable name only. Mutually exclusive with api_key and clear_api_key.
        api_key:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          description: Raw key written directly to the local system credential store. It is never returned or stored in SQLite. Mutually exclusive with api_key_env and clear_api_key.
        clear_api_key:
          type: boolean
          description: Remove the current system credential reference. Valid only for updates and mutually exclusive with api_key and api_key_env.
        enabled:
          type: boolean
          default: true
        set_default:
          type: boolean
    ModelConfigTestResult:
      type: object
      required: [schema_version, config_id, provider, model, ok, latency_ms, capabilities]
      properties:
        schema_version:
          type: string
        config_id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/ModelProvider"
        model:
          type: string
        ok:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        request_id:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
