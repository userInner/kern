            - running
            - waiting_approval
            - waiting_input
            - verifying
            - completed
            - partially_completed
            - failed
            - cancelled
        result:
          type: string
        error_message:
          type: string
        active_attempt_id:
          type: string
          format: uuid
        model_config_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
