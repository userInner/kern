      properties:
        timeout_ms: {type: integer, format: int64, minimum: 1000}
        token_budget: {type: integer, minimum: 1}
        cost_budget_micros: {type: integer, format: int64, minimum: 0}
        retries: {type: integer, minimum: 0}
        worker_count: {type: integer, minimum: 1}
