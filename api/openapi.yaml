        usage:
          $ref: "#/components/schemas/EvaluationUsage"
    EvaluationCaseResult:
      type: object
      required: [case_id, variant_id, attempt, task_status, passed, score, grades, usage, started_at, completed_at]
      properties:
        case_id: {type: string}
        variant_id: {type: string}
        task_id: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        task_status: {type: string}
        passed: {type: boolean}
        score: {type: number}
        grades:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationGrade"
        usage:
          $ref: "#/components/schemas/EvaluationUsage"
        error: {type: string}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    EvaluationVariantMetrics:
      type: object
