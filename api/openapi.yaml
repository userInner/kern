openapi: 3.1.0
info:
  title: Kern Core API
  version: 0.1.0
  description: Loopback-only task lifecycle and persisted-event API. SDK clients use the configured bearer token; the bundled browser uses a signed, short-lived bearer token injected into its same-origin HTML bootstrap. Authentication cookies are not used.
servers:
  - url: http://127.0.0.1:8787
    description: Default loopback-only development server. Kern also validates the request peer, Host, Origin and configured HTTP/TLS mode.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Runtime health and execution mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Runtime dependencies are ready to serve requests.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, status, mode]
                properties:
                  schema_version:
                    type: string
                  status:
                    type: string
                    const: ready
                  mode:
                    type: string
        "503":
          description: A required runtime dependency is unavailable.
  /metrics:
    get:
      operationId: getPrometheusMetrics
      description: Available only when observability.metrics_enabled is true. Labels use Core-controlled low-cardinality vocabularies.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restart-safe metrics derived from the durable task ledger plus bounded process gauges.
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Authentication is required.
        "404":
          description: Metrics are disabled.
  /api/v1/settings:
    get:
      operationId: getRuntimeSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Public-safe defaults used by future task executions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "401":
          description: Authentication is required.
    put:
      operationId: updateRuntimeSettings
      description: Persists and applies settings to executions that start after this update. Running executions keep their original budget snapshot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSettingsInput"
      responses:
        "200":
          description: Persisted effective settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSettings"
        "400":
          description: A budget, policy profile, timeout, or retention value is invalid.
  /api/v1/settings/cleanup-preview:
    get:
      operationId: previewRetentionCleanup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Non-mutating count of terminal task data older than the configured retention boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupPreview"
  /api/v1/settings/cleanup:
    post:
      operationId: runRetentionCleanup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  const: true
      responses:
        "200":
          description: Committed task deletion and safely pruned unreferenced content objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupResult"
        "400":
          description: Explicit confirmation is missing.
  /api/v1/tasks:
    get:
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Newest tasks first.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, tasks]
                properties:
                  schema_version:
                    type: string
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              additionalProperties: false
              properties:
                title:
                  type: string
                goal:
                  type: string
                  minLength: 1
                  maxLength: 20000
                model_config_id:
                  type: string
                  format: uuid
                plugins:
                  $ref: "#/components/schemas/TaskPluginSelection"
                attachments:
                  type: array
                  maxItems: 4
                  description: Images persisted as task-scoped immutable artifacts before execution.
                  items:
                    $ref: "#/components/schemas/TaskAttachmentInput"
      responses:
        "202":
          description: Task persisted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Selected model config is missing or disabled.
  /api/v1/models:
    get:
      operationId: listModelConfigs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Public-safe model settings. Secret values and references are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, credential_store_available, providers, configs]
                properties:
                  schema_version:
                    type: string
                  credential_store_available:
                    type: boolean
                    description: Whether this Core instance can write raw keys into the local system credential store.
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelProvider"
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelConfig"
  /api/v1/model-configs:
    post:
      operationId: createModelConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelConfigInput"
      responses:
        "201":
          description: Model connection saved; only an opaque environment reference is persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConfig"
        "400":
          description: Invalid provider, endpoint, model, or environment reference.
        "409":
          description: A model config with this name already exists.
  /api/v1/model-configs/{model_config_id}:
    parameters:
      - $ref: "#/components/parameters/ModelConfigID"
    put:
      operationId: updateModelConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelConfigInput"
      responses:
        "200":
          description: Updated public-safe model connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConfig"
        "404":
          description: Model config not found.
        "409":
          description: Model config name conflict.
    delete:
      operationId: deleteModelConfig
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Model config deleted. Historical Attempts retain secret-free snapshots.
        "404":
          description: Model config not found.
  /api/v1/model-configs/{model_config_id}/test:
    parameters:
      - $ref: "#/components/parameters/ModelConfigID"
    post:
      operationId: testModelConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bounded live provider probe. Response content and credentials are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConfigTestResult"
        "404":
          description: Model config not found.
        "409":
          description: Model config is disabled.
        "502":
          description: Provider connection or authentication failed.
  /api/v1/plugins:
    get:
      operationId: listPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Installed plugins. Private installation paths are never exposed.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, plugins]
                properties:
                  schema_version:
                    type: string
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plugin"
  /api/v1/plugins/install:
    post:
      operationId: installPlugin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Slash-separated plugin directory relative to the configured Kern workspace.
                enable:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Package copied, integrity checked, persisted, and optionally enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "200":
          description: The identical package was already installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "400":
          description: Invalid, incompatible, corrupt, or unsafe package.
        "409":
          description: A conflicting version is already installed.
  /api/v1/plugins/{plugin_id}:
    parameters:
      - $ref: "#/components/parameters/PluginID"
    get:
      operationId: getPlugin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Public-safe installed plugin snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin not found.
    delete:
      operationId: removePlugin
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Plugin metadata and its quarantined package were removed.
        "404":
          description: Plugin not found.
  /api/v1/plugins/{plugin_id}/enable:
    parameters:
      - $ref: "#/components/parameters/PluginID"
    post:
      operationId: enablePlugin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Package integrity was rechecked and the plugin was enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "400":
          description: Installed package no longer passes integrity validation.
        "404":
          description: Plugin not found.
  /api/v1/plugins/{plugin_id}/disable:
    parameters:
      - $ref: "#/components/parameters/PluginID"
    post:
      operationId: disablePlugin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plugin was disabled for future task selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin not found.
  /api/v1/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getTask
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current task snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/events:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: streamTaskEvents
      security:
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Persisted task events, replayed after Last-Event-ID.
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/tasks/{task_id}/messages:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: submitTaskInput
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 20000
                attachments:
                  type: array
                  maxItems: 4
                  description: New images added to the inherited task context as immutable artifacts.
                  items:
                    $ref: "#/components/schemas/TaskAttachmentInput"
      responses:
        "202":
          description: A new Attempt was created with inherited context, user input, and optional images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found.
        "409":
          description: Task is active or has unresolved side effects.
  /api/v1/tasks/{task_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: listPendingApprovals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exact, unexpired authorization requests pending for this task.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, approvals]
                properties:
                  schema_version:
                    type: string
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalRequest"
  /api/v1/tasks/{task_id}/plan:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: getCurrentTaskPlan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current Attempt plan, or null when the task is simple enough to run without one.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, plan]
                properties:
                  schema_version:
                    type: string
                  plan:
                    oneOf:
                      - $ref: "#/components/schemas/Plan"
                      - type: "null"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/verifications:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: listTaskVerifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deterministic checks and aggregate conclusion for the current Attempt.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, attempt_id, verifications]
                properties:
                  schema_version:
                    type: string
                  attempt_id:
                    type: string
                    format: uuid
                  verifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Verification"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/plugins:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: listTaskPlugins
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Exact plugin versions and resources selected for the active Attempt.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, attempt_id, plugins]
                properties:
                  schema_version:
                    type: string
                  attempt_id:
                    type: string
                    format: uuid
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginUsage"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: listTaskArtifacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Immutable content-addressed artifacts owned by this task.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, artifacts]
                properties:
                  schema_version:
                    type: string
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/operations/uncertain:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    get:
      operationId: listUncertainOperations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Interrupted operation outcomes that require an explicit human conclusion.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, operations]
                properties:
                  schema_version:
                    type: string
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operation"
        "404":
          description: Task not found.
  /api/v1/tasks/{task_id}/artifacts/{artifact_id}:
    parameters:
      - $ref: "#/components/parameters/TaskID"
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadTaskArtifact
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integrity-checked artifact content, returned as an attachment.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Artifact not found for this task.
        "409":
          description: Stored artifact failed its integrity check.
  /api/v1/tasks/{task_id}/pause:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: pauseTask
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task durably paused at an execution boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Task cannot be paused from its current state.
  /api/v1/tasks/{task_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: cancelTask
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task durably cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Task cannot be cancelled from its current state.
  /api/v1/tasks/{task_id}/resume:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: resumeTask
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new attempt was created for the paused task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Task is not paused.
  /api/v1/tasks/{task_id}/retry:
    parameters:
      - $ref: "#/components/parameters/TaskID"
    post:
      operationId: retryTask
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new attempt was created for a terminal task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Task is not terminal.
  /api/v1/approvals/{request_id}/decision:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideApproval
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, denied]
      responses:
        "200":
          description: Immutable approval receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalReceipt"
        "404":
          description: Approval request not found.
        "409":
          description: Approval request has already been decided or expired.
  /api/v1/operations/{operation_id}/resolution:
    parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveUncertainOperation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [confirmed_succeeded, confirmed_not_executed]
      responses:
        "200":
          description: Immutable human recovery receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResolutionReceipt"
        "404":
          description: Operation not found.
        "409":
          description: Operation is no longer uncertain or has a different recorded resolution.
  /api/v1/evals/runs:
    get:
      operationId: listEvaluationRuns
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Newest durable evaluation runs first.
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, runs]
                properties:
                  schema_version:
                    type: string
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvaluationRun"
    post:
      operationId: startEvaluationRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEvaluationInput"
      responses:
        "202":
          description: Suite validated and evaluation durably queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "400":
          description: Invalid suite path, manifest, variant, or plugin source.
  /api/v1/evals/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunID"
    get:
      operationId: getEvaluationRun
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Durable evaluation progress snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "404":
          description: Evaluation run not found.
  /api/v1/evals/runs/{run_id}/report:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunID"
    get:
      operationId: getEvaluationReport
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Immutable reproducible evaluation report.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReport"
        "404":
          description: Evaluation run not found.
        "409":
          description: Evaluation report is not ready.
  /api/v1/evals/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunID"
    post:
      operationId: cancelEvaluationRun
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "404":
          description: Evaluation run not found.
  /api/v1/evals/runs/{run_id}/pause:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunID"
    post:
      operationId: pauseEvaluationRun
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Active workers stopped after preserving terminal Case/Variant jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "404":
          description: Evaluation run not found.
        "409":
          description: The run cannot be paused from its current state.
  /api/v1/evals/runs/{run_id}/resume:
    parameters:
      - $ref: "#/components/parameters/EvaluationRunID"
    post:
      operationId: resumeEvaluationRun
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Reproducibility identity revalidated and remaining jobs queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRun"
        "404":
          description: Evaluation run not found.
        "409":
          description: Run is not paused or its immutable inputs changed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Persistent server token for SDK clients or a signed short-lived browser bootstrap token.
  parameters:
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelConfigID:
      name: model_config_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PluginID:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)+$"
    EvaluationRunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RuntimeSettings:
      allOf:
        - $ref: "#/components/schemas/RuntimeSettingsInput"
        - type: object
          required: [schema_version]
          properties:
            schema_version:
              type: string
              const: "1"
    RuntimeSettingsInput:
      type: object
      additionalProperties: false
      required:
        - max_turns
        - max_tool_calls
        - max_tokens
        - max_cost_usd
        - task_timeout
        - policy_profile
        - retention_days
      properties:
        max_turns:
          type: integer
          minimum: 1
          maximum: 10000
        max_tool_calls:
          type: integer
          minimum: 1
          maximum: 100000
        max_tokens:
          type: integer
          minimum: 1
