          enum: [openai-compatible]
        base_url:
          type: string
          format: uri
        model: {type: string, minLength: 1, maxLength: 200}
        api_key_env:
          type: string
          pattern: "^[A-Z_][A-Z0-9_]{0,127}$"
        max_tokens: {type: integer, minimum: 32, maximum: 4096}
    EvaluationVariantDefinition:
      type: object
