        success_rate_test:
          type: string
          enum: [mcnemar_exact_two_sided]
        success_rate_p_value: {type: number, minimum: 0, maximum: 1}
        significance_alpha: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
        success_rate_improvement_significant: {type: boolean}
        improvements:
          type: array
          items: {type: string}
        regressions:
          type: array
          items: {type: string}
        safety_regressed: {type: boolean}
    EvaluationDefaults:
      type: object
